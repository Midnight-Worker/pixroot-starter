[platformio]
default_envs = native

[common]
lib_deps =
    gperez88/PixelRoot32-Game-Engine@^1.8.0
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions

[env:native]
platform = native
lib_deps =
    ${common.lib_deps}
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -DPHYSICAL_DISPLAY_WIDTH=320
    -DPHYSICAL_DISPLAY_HEIGHT=240
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -lSDL2
    -mconsole

; M5Stack FIRE, built-in 320x240 ILI9342C-compatible display
[env:m5]
platform = espressif32
board = m5stack-fire
framework = arduino
lib_deps =
    ${common.lib_deps}
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -fno-rtti
    -DPLATFORM_M5
    -DPIXELROOT32_ENABLE_AUDIO=0
    -DPIXELROOT32_ENABLE_PHYSICS=0
    -DPHYSICAL_DISPLAY_WIDTH=320
    -DPHYSICAL_DISPLAY_HEIGHT=240
    -DLOGICAL_WIDTH=160
    -DLOGICAL_HEIGHT=120
    -DDISPLAY_ROTATION=1
    -DTFT_INVERSION_ON
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER
    -DM5STACK
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=14
    -DTFT_DC=27
    -DTFT_RST=33
    -DTFT_BL=32
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; ESP32-S3 DevKitC with the user's 240x320 ILI9341 wiring
[env:esp32s3_ili9341]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    ${common.lib_deps}
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -fno-rtti
    -DPLATFORM_ESP32S3_ILI9341
    -DPIXELROOT32_NO_DAC_AUDIO
    -DPIXELROOT32_ENABLE_AUDIO=0
    -DPIXELROOT32_ENABLE_PHYSICS=0
    -DPHYSICAL_DISPLAY_WIDTH=240
    -DPHYSICAL_DISPLAY_HEIGHT=320
    -DLOGICAL_WIDTH=120
    -DLOGICAL_HEIGHT=160
    -DDISPLAY_ROTATION=0
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=9
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=14
    -DTFT_BL=-1
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

; Classic ESP32 with the user's 170x320 ST7789 wiring
[env:esp32_st7789]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ${common.lib_deps}
build_unflags =
    ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -fno-rtti
    -DPLATFORM_ESP32_ST7789
    -DPIXELROOT32_ENABLE_AUDIO=0
    -DPIXELROOT32_ENABLE_PHYSICS=0
    -DPHYSICAL_DISPLAY_WIDTH=170
    -DPHYSICAL_DISPLAY_HEIGHT=320
    -DLOGICAL_WIDTH=85
    -DLOGICAL_HEIGHT=160
    -DDISPLAY_ROTATION=0
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=32
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
